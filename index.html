<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1712">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Libreria">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>La mia libreria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --wall:#1c1712; --ink:#f3ead8; --muted:#b5a487; --line:#4a3d2e; --field:#2a221a;
  --accent:#d9a65a;
  --row:200px; --plank:16px; --s:1;
}
@media (max-width:640px){ :root{ --row:160px; --plank:13px; --s:.8; } }
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh; color:var(--ink); font-family:Inter,system-ui,sans-serif;
  background:radial-gradient(ellipse at 50% -20%, #3b2e21 0%, transparent 60%), var(--wall);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}
header{max-width:1100px;margin:0 auto;padding:calc(30px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) 6px calc(20px + env(safe-area-inset-left));display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:clamp(32px,7vw,46px);margin:0;line-height:1}
.sub{color:var(--muted);font-size:14px;margin-top:6px}
.btn{appearance:none;border:0;border-radius:999px;padding:11px 18px;font-weight:600;font-size:14px;cursor:pointer;background:var(--accent);color:#2a1d0f;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid #5d4c39}
.btn.danger{background:#9e3a2e;color:#fff}
.btn:disabled{opacity:.5;cursor:default}

.controls{max-width:1100px;margin:0 auto;padding:14px 20px 6px;display:flex;gap:10px;flex-wrap:wrap}
.field{background:var(--field);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:11px 14px;font:15px Inter,sans-serif;outline:none;width:100%}
.field:focus{border-color:var(--accent)}
.controls .search{flex:1 1 240px;position:relative}
.controls .search input{padding-left:38px}
.controls .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.6}
.controls select{flex:0 1 230px}
.years{max-width:1100px;margin:0 auto;padding:8px 20px 4px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.years::-webkit-scrollbar{display:none}
.years button{flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:7px 15px;font-size:14px;font-weight:500;cursor:pointer}
.years button.on{background:var(--ink);color:#231b13;border-color:var(--ink)}
.status{max-width:1100px;margin:6px auto 0;padding:0 20px;color:var(--accent);font-size:13px;min-height:0}
.status:empty{display:none}

main{max-width:1100px;margin:0 auto;padding:4px calc(20px + env(safe-area-inset-right)) calc(90px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left))}
.year-sec{margin-top:24px}
.year-head{display:flex;align-items:baseline;gap:12px;margin:0 4px 10px}
.year-head h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:32px;margin:0;font-weight:600}
.year-head span{color:var(--muted);font-size:14px}

/* Bookcase */
.case{
  position:relative;border-radius:6px;padding:14px 16px 0;
  border:14px solid #5b381f;border-bottom-width:0;
  border-image:linear-gradient(180deg,#7a4b28,#5b381f 40%,#4a2d18) 14;
  background:
    linear-gradient(90deg, rgba(0,0,0,.55), transparent 7%, transparent 93%, rgba(0,0,0,.55)),
    #140f0b;
  box-shadow:0 20px 40px rgba(0,0,0,.45);
}
.case::after{ /* base */
  content:"";position:absolute;left:-14px;right:-14px;bottom:-18px;height:18px;
  background:linear-gradient(180deg,#6b4224,#3e2513);border-radius:0 0 4px 4px;
}
.shelf{
  display:flex;flex-wrap:wrap;column-gap:2px;row-gap:var(--plank);
  padding-bottom:var(--plank);margin:0 -16px;padding-left:16px;padding-right:16px;
  background-image:
    repeating-linear-gradient(180deg,
      transparent 0, transparent var(--row),
      #a0703f var(--row), #865a32 calc(var(--row) + var(--plank)*.45), #5e3b1f calc(var(--row) + var(--plank))),
    repeating-linear-gradient(180deg,
      rgba(0,0,0,.55) 0, rgba(0,0,0,0) 16px, transparent var(--row), transparent calc(var(--row) + var(--plank)));
  background-position:0 0, 0 calc(var(--row) + var(--plank));
}
.slot{height:var(--row);display:flex;align-items:flex-end}
.empty-row{height:var(--row);display:flex;align-items:center;justify-content:center;width:100%;color:#8e7c62;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:20px;text-align:center;padding:0 20px}

/* Spines */
.spine{
  position:relative;
  width:auto;min-width:calc(var(--w) * var(--s) * 1px);
  padding:0 calc(5px * var(--s));
  height:calc(var(--row) * var(--hp));
  background:var(--c);color:var(--t);
  border-radius:3px 3px 1px 1px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  box-shadow: inset 3px 0 4px rgba(255,255,255,.14), inset -5px 0 7px rgba(0,0,0,.38), 2px 0 3px rgba(0,0,0,.45);
  transition:transform .2s ease, filter .2s;
  border:0;
}
.spine:hover,.spine:focus-visible{transform:translateY(-7px);filter:brightness(1.08);outline:none}
.spine .txt{
  writing-mode:vertical-rl;transform:rotate(180deg);
  display:block;text-align:center;white-space:normal;
  max-height:calc(var(--row) * var(--hp) - 30px);
  line-height:1.12;position:relative;z-index:1;
}
.spine .au{display:block;font-size:calc(9px * var(--s) + 1px);letter-spacing:.8px;text-transform:uppercase;opacity:.85;margin-block-end:4px;font-weight:500}
.spine .ti{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:calc(13px * var(--s) + 2px);letter-spacing:.2px}
.spine.v0::before,.spine.v0::after{content:"";position:absolute;left:0;right:0;height:2px;background:var(--g);opacity:.8;box-shadow:0 4px 0 var(--g)}
.spine.v0::before{top:9px}.spine.v0::after{bottom:15px}
.spine.v1::before{content:"";position:absolute;left:0;right:0;top:12px;height:18%;background:rgba(0,0,0,.28);border-top:1px solid var(--g);border-bottom:1px solid var(--g)}
.spine.v2::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12%;background:rgba(0,0,0,.25)}
.spine.new{animation:drop .7s cubic-bezier(.2,.9,.3,1.2)}
@keyframes drop{from{transform:translateY(-60px);opacity:0}to{transform:none;opacity:1}}

.nores{color:var(--muted);text-align:center;margin:60px 0;font-family:"Cormorant Garamond",Georgia,serif;font-size:22px;font-style:italic}

/* Overlay / sheet */
.overlay{position:fixed;inset:0;background:rgba(10,7,4,.7);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.overlay[hidden]{display:none}
.sheet{background:#231c15;border:1px solid #4a3d2e;border-radius:18px;width:100%;max-width:480px;max-height:calc(100vh - 40px);overflow:auto;padding:22px}
@media (max-width:640px){
  .overlay{align-items:flex-end;padding:0}
  .sheet{border-radius:18px 18px 0 0;max-height:92vh;padding-bottom:calc(22px + env(safe-area-inset-bottom))}
}
.sheet h3{font-family:"Cormorant Garamond",Georgia,serif;font-size:28px;font-weight:600;margin:0 0 14px}
.sheet label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stars{display:flex;gap:4px}
.stars button{background:none;border:0;font-size:26px;cursor:pointer;color:#5d4c39;padding:0 2px;line-height:1}
.stars button.on{color:var(--accent)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches button{width:30px;height:30px;border-radius:8px;border:2px solid transparent;cursor:pointer}
.swatches button.on{border-color:var(--ink)}
.swatches .auto{width:auto;padding:0 10px;background:var(--field);color:var(--muted);font-size:12px;border:1px solid var(--line)}
.swatches .auto.on{border:2px solid var(--ink);color:var(--ink)}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.err{color:#e08a7c;font-size:13px;margin-top:10px}
.err:empty{display:none}
textarea.field{min-height:80px;resize:vertical}
.hbtns{display:flex;gap:8px;align-items:center}
.htitle{display:flex;align-items:center;gap:12px;min-width:0}
.iconbtn.back{font-size:28px;padding-bottom:3px;flex:0 0 auto}
.iconbtn[hidden],.btn[hidden],.home[hidden],.stats[hidden],#viewLib[hidden]{display:none}
#homeLink{cursor:pointer}
.home{max-width:1100px;margin:0 auto;padding:18px calc(20px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));display:grid;gap:16px}
@media (min-width:700px){ .home{grid-template-columns:1fr 1fr} }
.card{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:linear-gradient(180deg,#2a2119,#211a13);border:1px solid #4a3d2e;border-radius:20px;padding:18px;color:var(--ink);cursor:pointer;box-shadow:0 12px 30px rgba(0,0,0,.35);transition:transform .15s, border-color .15s}
.card:hover,.card:focus-visible{transform:translateY(-2px);border-color:var(--accent);outline:none}
.card-art{flex:0 0 auto;width:120px;height:96px;border-radius:10px;background:#140f0b;display:flex;align-items:flex-end;gap:2px;padding:0 8px;position:relative;overflow:hidden;border-bottom:8px solid #8a5a33}
.card-art .spine{cursor:default;box-shadow:inset 2px 0 2px rgba(255,255,255,.12), inset -3px 0 4px rgba(0,0,0,.35)}
.card-art .spine .txt{display:none}
.card-art .spine:hover{transform:none}
.card-art.bars{gap:6px;padding:10px 12px 0;align-items:flex-end;border-bottom:0;background:#140f0b}
.card-art.bars i{flex:1;background:var(--accent);border-radius:4px 4px 0 0;opacity:.9;min-height:4px}
.card-body{flex:1;min-width:0}
.card-title{font-family:"Cormorant Garamond",Georgia,serif;font-size:30px;font-weight:600;line-height:1}
.card-sub{color:var(--muted);font-size:14px;margin-top:6px;line-height:1.4}
.chev{font-size:30px;color:var(--muted);flex:0 0 auto}
.stats{max-width:760px;margin:0 auto;padding:10px calc(20px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left))}
.stat-hero{background:linear-gradient(180deg,#2a2119,#211a13);border:1px solid #4a3d2e;border-radius:20px;padding:22px;text-align:center;margin-top:10px}
.stat-hero .num{font-family:"Cormorant Garamond",Georgia,serif;font-size:72px;font-weight:600;line-height:1;color:var(--accent)}
.stat-hero .lbl{color:var(--muted);font-size:15px;margin-top:6px}
.stats h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:28px;font-weight:600;margin:28px 4px 12px}
.yrow{display:grid;grid-template-columns:56px 1fr 44px;align-items:center;gap:12px;padding:12px 14px;background:#231c15;border:1px solid #3d3226;border-radius:14px;margin-bottom:10px;cursor:pointer;width:100%;color:var(--ink);text-align:left;font:inherit}
.yrow:hover{border-color:var(--accent)}
.yrow .y{font-family:"Cormorant Garamond",Georgia,serif;font-size:22px;font-weight:600}
.yrow .track{height:12px;background:#140f0b;border-radius:99px;overflow:hidden}
.yrow .fill{height:100%;background:linear-gradient(90deg,#b8843f,var(--accent));border-radius:99px}
.yrow .n{text-align:right;font-weight:600;font-size:17px}
.span2{grid-column:1/-1}
#homeBanner:empty{display:none}
.banner{display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap;background:#3a2a17;border:1px solid #8a6a3a;border-radius:16px;padding:14px 16px}
.banner b{display:block;font-size:15px}
.banner span{display:block;color:#e6cfa6;font-size:13px;margin-top:3px;line-height:1.4}
.banner-acts{display:flex;gap:8px;margin-left:auto}
.goal{background:#231c15;border:1px solid #3d3226;border-radius:18px;padding:18px;margin-top:14px}
.goal-head{display:flex;justify-content:space-between;align-items:center;font-family:"Cormorant Garamond",Georgia,serif;font-size:24px;font-weight:600}
.linkbtn{background:none;border:0;color:var(--accent);font:600 14px Inter,sans-serif;cursor:pointer;padding:4px}
.goal-num{margin-top:10px;font-size:15px;color:var(--muted)}
.goal-num b{font-size:26px;color:var(--ink);font-weight:600;margin-right:2px}
.goal-num span{float:right;color:var(--accent);font-weight:600;font-size:18px;margin-top:6px}
.goal-track{height:14px;background:#140f0b;border-radius:99px;overflow:hidden;margin-top:10px}
.goal-fill{height:100%;background:linear-gradient(90deg,#b8843f,var(--accent));border-radius:99px;transition:width .4s}
.goal-txt{color:var(--muted);font-size:14px;line-height:1.45;margin:10px 0 12px}
.goal .btn{width:100%}
.yrow .n small{color:var(--muted);font-weight:500;font-size:13px}
.stats .note{color:var(--muted);font-size:13px;text-align:center;margin-top:8px}
.iconbtn{width:42px;height:42px;border-radius:999px;border:1px solid #5d4c39;background:transparent;color:var(--ink);font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.welcome{max-width:460px;margin:50px auto;text-align:center;background:#231c15;border:1px solid #4a3d2e;border-radius:18px;padding:26px 22px}
.welcome h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:28px;margin:0 0 8px;font-weight:600}
.welcome p{color:var(--muted);line-height:1.5;margin:0 0 18px;font-size:15px}
.welcome .actions{justify-content:center}
.menu p{color:var(--muted);line-height:1.5;font-size:14px;margin:6px 0 0}
.menu .item{display:block;width:100%;text-align:left;background:var(--field);border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:14px 16px;margin-top:10px;cursor:pointer;font-size:15px;font-weight:600}
.menu .item small{display:block;color:var(--muted);font-weight:400;font-size:13px;margin-top:3px}
.ok{color:#9fc79a;font-size:13px;margin-top:10px}
.ok:empty{display:none}

.detail .who{color:var(--muted);font-size:16px;margin-top:-6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.chip{background:var(--field);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
.detail .notes{white-space:pre-wrap;line-height:1.5;font-size:15px;background:var(--field);border-radius:12px;padding:12px 14px}
.detail .st{color:var(--accent);font-size:20px;letter-spacing:2px}
.mini{display:flex;gap:16px;align-items:flex-start}
.cover{width:120px;flex:0 0 auto;border-radius:4px 6px 6px 4px;box-shadow:0 8px 20px rgba(0,0,0,.5), inset 3px 0 0 rgba(255,255,255,.08);display:block;background:#2a221a;object-fit:cover;aspect-ratio:2/3}
@media (min-width:641px){ .cover{width:140px} }
.coveracts{display:flex;flex-wrap:nowrap;gap:6px;margin:14px 0 4px}
.coveracts .btn{flex:1 1 0;min-width:0;padding:8px 4px;font-size:12px;text-align:center;overflow:hidden;text-overflow:ellipsis}
.coveracts .btn[hidden]{display:none}
.btn.small{padding:8px 13px;font-size:13px}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px;margin-top:10px}
.picks button{padding:0;border:2px solid transparent;border-radius:6px;background:#2a221a;cursor:pointer;aspect-ratio:2/3;overflow:hidden}
.picks button:hover,.picks button:focus-visible{border-color:var(--accent);outline:none}
.picks img{width:100%;height:100%;object-fit:cover;display:block}
.hint{color:var(--muted);font-size:13px;margin-top:8px}
.hint:empty{display:none}
textarea.notesarea{min-height:200px;font-size:13px;line-height:1.55;text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.saved{color:var(--muted);font-size:12px;height:16px;margin-top:4px;text-align:right}
.mini .spine{flex:0 0 auto;cursor:default}
.mini .spine:hover{transform:none}
</style>
</head>
<body>
<header>
  <div class="htitle">
    <button class="iconbtn back" id="backBtn" aria-label="Torna alla pagina iniziale" hidden>‹</button>
    <div>
      <h1 id="homeLink">La mia libreria</h1>
      <div class="sub" id="sub">&nbsp;</div>
    </div>
  </div>
  <div class="hbtns"><button class="iconbtn" id="menuBtn" aria-label="Backup">⋯</button><button class="btn" id="addBtn" hidden>+ Aggiungi libro</button></div>
</header>

<section id="viewHome" class="home">
  <div id="homeBanner" class="span2"></div>
  <button class="card" id="goLib">
    <div class="card-art" id="homeShelf"></div>
    <div class="card-body">
      <div class="card-title">Libreria</div>
      <div class="card-sub" id="homeLibSub"></div>
    </div>
    <span class="chev">›</span>
  </button>
  <button class="card" id="goStats">
    <div class="card-art bars" id="homeBars"></div>
    <div class="card-body">
      <div class="card-title">Statistiche</div>
      <div class="card-sub" id="homeStatsSub"></div>
    </div>
    <span class="chev">›</span>
  </button>
</section>

<section id="viewStats" class="stats" hidden></section>

<div id="viewLib" hidden>
<div class="controls">
  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input class="field" id="q" type="search" placeholder="Cerca per titolo o autore" autocomplete="off">
  </div>
  <select class="field" id="authorSel"><option value="">Tutti gli autori</option></select>
</div>
<nav class="years" id="years"></nav>
<div class="status" id="status"></div>
<main id="main"></main>
</div>

<!-- Form -->
<div class="overlay" id="formOv" hidden>
  <form class="sheet" id="form" novalidate>
    <h3 id="formTitle">Nuovo libro</h3>
    <label for="fTitle">Titolo</label>
    <input class="field" id="fTitle" required autocomplete="off">
    <label for="fAuthor">Autore</label>
    <input class="field" id="fAuthor" list="authorList" required autocomplete="off">
    <label for="fAuthorSort">Nell'elenco autori (cognome e nome)</label>
    <input class="field" id="fAuthorSort" autocomplete="off">
    <datalist id="authorList"></datalist>
    <div class="row2">
      <div>
        <label for="fYear">Anno di lettura</label>
        <input class="field" id="fYear" type="number" inputmode="numeric" min="1900" max="2100">
      </div>
      <div>
        <label for="fPages">Pagine (facoltativo)</label>
        <input class="field" id="fPages" type="number" inputmode="numeric" min="1" max="5000">
      </div>
    </div>
    <label for="fDate">Finito il (facoltativo)</label>
    <input class="field" id="fDate" type="date">
    <label>Voto</label>
    <div class="stars" id="fStars"></div>
    <label>Colore del dorso</label>
    <div class="swatches" id="fSw"></div>
    <div class="err" id="fErr"></div>
    <div class="actions">
      <button type="button" class="btn ghost" id="fCancel">Annulla</button>
      <button type="submit" class="btn" id="fSave">Metti sullo scaffale</button>
    </div>
  </form>
</div>

<!-- Conferma -->
<div class="overlay" id="cfOv" hidden style="z-index:40">
  <div class="sheet" style="max-width:380px">
    <h3 id="cfTitle" style="font-size:24px"></h3>
    <p id="cfText" style="color:var(--muted);line-height:1.5;margin:0"></p>
    <div class="actions">
      <button class="btn ghost" id="cfNo">Annulla</button>
      <button class="btn" id="cfYes">Conferma</button>
    </div>
  </div>
</div>

<!-- Menu -->
<div class="overlay" id="menuOv" hidden>
  <div class="sheet menu" id="menu"></div>
</div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<input type="file" id="photoFile" accept="image/*" hidden>

<!-- Detail -->
<div class="overlay" id="detOv" hidden>
  <div class="sheet detail" id="det"></div>
</div>

<script>
(() => {
const APP_VERSION = "1.7";
const PALETTE = ["#7a2e2a","#2f4a3a","#23395b","#c49a3a","#e6d9bd","#1f1d1b","#2c5d63","#5a3550","#a2512b","#6b7b8c","#6b6a3a","#8c2f4b","#3d3a6b","#b8b2a3","#45604d","#9b6b43"];
const NOW_YEAR = new Date().getFullYear();
const state = { books: [], view: NOW_YEAR, q: "", author: "", newId: null, editing: null, rating: 0, color: "" };


const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
function hash(s){ let h = 2166136261; for (const ch of s){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function lum(hex){ const n = parseInt(hex.slice(1),16); const r=(n>>16)&255,g=(n>>8)&255,b=n&255; return (0.299*r+0.587*g+0.114*b)/255; }
function setStatus(t){ $("status").textContent = t || ""; }

function spineHTML(b, extraClass = ""){
  const h = hash((b.title||"") + "|" + (b.author||""));
  const color = b.color || PALETTE[h % PALETTE.length];
  const light = lum(color) > 0.6;
  const text = light ? "#2a2018" : "#f4ead6";
  const gold = light ? "#7a5a2a" : "#d8b26a";
  const pages = Number(b.pages) || 0;
  const w = pages ? Math.max(22, Math.min(60, 16 + pages / 14)) : 26 + (h >> 4) % 16;
  const hp = (0.80 + ((h >> 9) % 17) / 100).toFixed(2);
  const v = (h >> 13) % 3;
  return `<button class="spine v${v} ${extraClass}" data-id="${esc(b.id)}" title="${esc(b.title)} — ${esc(b.author)}"
    style="--c:${color};--t:${text};--g:${gold};--w:${w.toFixed(0)};--hp:${hp}">
    <span class="txt"><span class="au">${esc(b.author)}</span><span class="ti">${esc(b.title)}</span></span></button>`;
}

const PARTICLES = new Set(["de","di","da","del","della","dello","dei","degli","dal","dalla","lo","la","le","van","von","der","den","du","des","dos","mac"]);
const ARTICLES = new Set(["gli","i","il","la","le","lo","the","l'"]);
// Nomi già scritti con il cognome per primo (uso orientale)
const SURNAME_FIRST = new Set(["kashiwai hisashi","murata sayaka","hu anyan"]);
function flipName(name){
  if (SURNAME_FIRST.has(name.trim().toLowerCase())) return name.trim();
  const w = name.trim().split(/\s+/);
  if (w.length < 2 || ARTICLES.has(w[0].toLowerCase())) return name.trim();
  let i = w.length - 1;
  while (i > 1 && PARTICLES.has(w[i-1].toLowerCase())) i--;
  return w.slice(i).join(" ") + " " + w.slice(0, i).join(" ");
}
function authorLabel(a){ return String(a || "").split(",").map(flipName).filter(Boolean).join(", "); }
function sortKey(b){ return (b.finished || String(b.createdAt || "").slice(0,10)) + "|" + (b.createdAt || ""); }
function matches(b){
  if (state.author && b.author !== state.author) return false;
  if (state.q){ const q = norm(state.q); if (!norm(b.title).includes(q) && !norm(b.author).includes(q)) return false; }
  return true;
}

function render(){
  try { renderHome(); renderStats(); } catch(e){}
  const books = state.books;
  const years = [...new Set([NOW_YEAR, ...books.map(b => Number(b.year)).filter(Boolean)])].sort((a,b) => b-a);
  if (state.view !== "all" && !years.includes(state.view)) state.view = NOW_YEAR;

  // subtitle
  const thisYear = books.filter(b => Number(b.year) === NOW_YEAR).length;
  $("sub").textContent = books.length
    ? `${books.length} ${books.length === 1 ? "libro letto" : "libri letti"} · ${thisYear} nel ${NOW_YEAR}`
    : "Lo scaffale ti aspetta";

  // year tabs
  $("years").innerHTML = `<button data-y="all" class="${state.view==="all"?"on":""}">Tutti</button>` +
    years.map(y => `<button data-y="${y}" class="${state.view===y?"on":""}">${y}</button>`).join("");

  // authors
  const labels = {};
  for (const b of books){ if (b.author && (!labels[b.author] || b.authorSort)) labels[b.author] = b.authorSort || labels[b.author] || authorLabel(b.author); }
  const authors = Object.keys(labels).sort((a,b) => labels[a].localeCompare(labels[b], "it"));
  const sel = $("authorSel");
  if (state.author && !authors.includes(state.author)) state.author = "";
  sel.innerHTML = `<option value="">Tutti gli autori</option>` + authors.map(a => `<option value="${esc(a)}" ${a===state.author?"selected":""}>${esc(labels[a])}</option>`).join("");
  $("authorList").innerHTML = authors.map(a => `<option value="${esc(a)}">`).join("");

  // shelves
  const filtering = !!(state.q || state.author);
  const shown = state.view === "all" ? years : [state.view];
  let html = "", total = 0;
  for (const y of shown){
    const list = books.filter(b => Number(b.year) === y && matches(b)).sort((a,b) => sortKey(a).localeCompare(sortKey(b)));
    total += list.length;
    if (!list.length && (filtering || state.view === "all")) continue;
    const n = books.filter(b => Number(b.year) === y).length;
    const label = filtering ? `${list.length} di ${n}` : `${n} ${n===1?"libro":"libri"}`;
    html += `<section class="year-sec"><div class="year-head"><h2>${y}</h2><span>${label}</span></div>
      <div class="case"><div class="shelf">` +
      (list.length
        ? list.map(b => `<div class="slot">${spineHTML(b, b.id === state.newId ? "new" : "")}</div>`).join("")
        : `<div class="empty-row">Nessun libro ancora: aggiungi il primo del ${y}</div>`) +
      `</div></div></section>`;
  }
  if (!books.length){
    html = `<div class="welcome"><h2>Benvenuto nella tua libreria</h2>
      <p>Aggiungi il primo libro letto, oppure importa un backup per ritrovare tutta la tua libreria.</p>
      <div class="actions"><button class="btn ghost" id="wImport">Importa backup</button><button class="btn" id="wAdd">Aggiungi libro</button></div></div>`;
  } else if (!html){
    html = filtering ? `<p class="nores">Nessun libro corrisponde alla ricerca</p>`
                     : `<p class="nores">Nessun libro sugli scaffali</p>`;
  }
  $("main").innerHTML = html;
  state.newId = null;
}

function yearCounts(){
  const m = {};
  for (const b of state.books){ const y = Number(b.year); if (y) m[y] = (m[y] || 0) + 1; }
  return Object.keys(m).map(Number).sort((a,b) => b - a).map(y => [y, m[y]]);
}
function renderHome(){
  const books = state.books;
  const n = books.length;
  const recent = [...books].sort((a,b) => String(b.createdAt||"").localeCompare(String(a.createdAt||""))).slice(0, 9).reverse();
  $("homeShelf").innerHTML = recent.length
    ? recent.map(b => `<div style="--row:78px;--s:.42">${spineHTML(b)}</div>`).join("")
    : "";
  $("homeLibSub").textContent = n ? `${n} ${n===1?"libro":"libri"} sugli scaffali` : "Lo scaffale ti aspetta";
  const yc = yearCounts().slice(0, 6).reverse();
  const max = Math.max(1, ...yc.map(x => x[1]));
  $("homeBars").innerHTML = yc.length ? yc.map(([y,c]) => `<i style="height:${Math.max(6, Math.round(c / max * 80))}px" title="${y}"></i>`).join("") : "";
  const cur = books.filter(b => Number(b.year) === NOW_YEAR).length;
  const gi = goalInfo(NOW_YEAR);
  $("homeStatsSub").textContent = !n ? "Libri letti, anno per anno"
    : gi.goal ? `${cur} di ${gi.goal} libri nel ${NOW_YEAR} · ${Math.min(100, Math.round(cur / gi.goal * 100))}%`
    : `${cur} ${cur===1?"libro":"libri"} nel ${NOW_YEAR}`;
  $("homeBanner").innerHTML = bannerHTML();
}
function renderStats(){
  const n = state.books.length;
  const yc = yearCounts();
  const max = Math.max(1, ...yc.map(x => x[1]));
  $("viewStats").innerHTML = `
    <div class="stat-hero"><div class="num">${n}</div><div class="lbl">${n===1?"libro letto":"libri letti"} in totale</div></div>
    ${goalCardHTML()}
    <h2>Per anno</h2>
    ${yc.length ? yc.map(([y,c]) => `
      <button class="yrow" data-y="${y}">
        <span class="y">${y}</span>
        <span class="track"><span class="fill" style="display:block;width:${Math.max(3, c / max * 100)}%"></span></span>
        <span class="n">${getGoals()[y] ? `${c}<small>/${getGoals()[y]}</small>` : c}</span>
      </button>`).join("") : `<p class="note">Ancora nessun libro registrato.</p>`}
    ${yc.length ? `<p class="note">Tocca un anno per aprire il suo scaffale.</p>` : ""}`;
}
$("viewStats").addEventListener("click", e => {
  if (e.target.closest("#goalSet")) return openGoal();
  const r = e.target.closest(".yrow"); if (!r) return;
  state.view = Number(r.dataset.y); state.q = ""; state.author = ""; $("q").value = "";

});

/* ---------- Obiettivo annuale ---------- */
function goalInfo(year){
  const goal = Number(getGoals()[year]) || 0;
  const read = state.books.filter(b => Number(b.year) === year).length;
  return { goal, read };
}
function paceText(read, goal){
  const now = new Date();
  const start = new Date(NOW_YEAR, 0, 1), end = new Date(NOW_YEAR + 1, 0, 1);
  const frac = (now - start) / (end - start);
  const expected = goal * frac;
  const diff = Math.round(read - expected);
  if (read >= goal) return "Obiettivo raggiunto! 🎉";
  const left = goal - read;
  const daysLeft = Math.max(1, Math.ceil((end - now) / 86400000));
  const pace = diff > 0 ? `Sei avanti di ${diff} ${diff===1?"libro":"libri"}` : diff < 0 ? `Sei indietro di ${-diff} ${diff===-1?"libro":"libri"}` : "Sei perfettamente in linea";
  return `${pace} · ne mancano ${left} in ${daysLeft} giorni`;
}
function goalCardHTML(){
  const { goal, read } = goalInfo(NOW_YEAR);
  if (!goal) return `
    <div class="goal">
      <div class="goal-head"><span>Obiettivo ${NOW_YEAR}</span></div>
      <p class="goal-txt">Quanti libri vuoi leggere quest'anno? Imposta un obiettivo e segui i progressi.</p>
      <button class="btn" id="goalSet">Imposta obiettivo</button>
    </div>`;
  const pct = Math.min(100, Math.round(read / goal * 100));
  return `
    <div class="goal">
      <div class="goal-head"><span>Obiettivo ${NOW_YEAR}</span><button class="linkbtn" id="goalSet">Modifica</button></div>
      <div class="goal-num"><b>${read}</b> di ${goal} libri <span>${pct}%</span></div>
      <div class="goal-track"><div class="goal-fill" style="width:${pct}%"></div></div>
      <p class="goal-txt">${esc(paceText(read, goal))}</p>
    </div>`;
}
function openGoal(){
  const cur = goalInfo(NOW_YEAR).goal;
  $("menu").innerHTML = `
    <h3>Obiettivo ${NOW_YEAR}</h3>
    <p>Quanti libri vuoi leggere nel ${NOW_YEAR}?</p>
    <input class="field" id="goalIn" type="number" inputmode="numeric" min="1" max="999" value="${cur || ""}" placeholder="Es. 40" style="margin-top:12px;font-size:20px;text-align:center">
    <div class="err" id="gErr"></div>
    <div class="actions">
      ${cur ? `<button class="btn ghost" id="gDel">Togli obiettivo</button>` : ""}
      <button class="btn ghost" id="gNo">Annulla</button>
      <button class="btn" id="gYes">Salva</button>
    </div>`;
  $("menuOv").hidden = false;
  setTimeout(() => $("goalIn").focus(), 50);
  $("gNo").onclick = () => $("menuOv").hidden = true;
  $("gYes").onclick = async () => {
    const n = parseInt($("goalIn").value, 10);
    if (!n || n < 1 || n > 999){ $("gErr").textContent = "Inserisci un numero tra 1 e 999."; return; }
    if (!(await askConfirm(cur ? "Cambiare l'obiettivo?" : "Impostare l'obiettivo?", `${n} libri nel ${NOW_YEAR}.`, "Salva"))) return;
    setGoal(NOW_YEAR, n); $("menuOv").hidden = true; render();
  };
  if (cur) $("gDel").onclick = async () => {
    if (!(await askConfirm("Togliere l'obiettivo?", `Non verrà più mostrato l'obiettivo del ${NOW_YEAR}.`, "Togli", true))) return;
    setGoal(NOW_YEAR, 0); $("menuOv").hidden = true; render();
  };
}

/* ---------- Promemoria backup ---------- */
const BACKUP_DAYS = 30;
function daysSince(iso){ return iso ? Math.floor((Date.now() - new Date(iso).getTime()) / 86400000) : Infinity; }
function backupDue(){
  if (!state.books.length) return false;
  const m = getMeta();
  if (m.snoozeUntil && Date.now() < new Date(m.snoozeUntil).getTime()) return false;
  if (!m.lastBackupAt) return !!m.lastChangeAt && daysSince(m.firstSeenAt || m.lastChangeAt) >= 7;
  const changed = m.lastChangeAt && new Date(m.lastChangeAt) > new Date(m.lastBackupAt);
  return changed && daysSince(m.lastBackupAt) >= BACKUP_DAYS;
}
function lastBackupText(){
  const d = getMeta().lastBackupAt;
  if (!d) return "Non hai ancora fatto un backup.";
  const n = daysSince(d);
  return "Ultimo backup: " + (n === 0 ? "oggi" : n === 1 ? "ieri" : `${n} giorni fa`) + ` (${new Date(d).toLocaleDateString("it-IT")}).`;
}
function bannerHTML(){
  if (!backupDue()) return "";
  const d = getMeta().lastBackupAt;
  const txt = d ? `L'ultimo backup è di ${daysSince(d)} giorni fa e da allora hai fatto delle modifiche.` : "Non hai ancora salvato un backup della libreria.";
  return `<div class="banner"><div><b>È ora di fare un backup</b><span>${txt}</span></div>
    <div class="banner-acts"><button class="btn ghost small" id="bkLater">Più tardi</button><button class="btn small" id="bkNow">Fai backup</button></div></div>`;
}

/* ---------- Conferma ---------- */
function askConfirm(title, text, okLabel = "Conferma", danger = false){
  return new Promise(resolve => {
    $("cfTitle").textContent = title; $("cfText").textContent = text || "";
    const yes = $("cfYes"), no = $("cfNo"), ov = $("cfOv");
    yes.textContent = okLabel; yes.className = danger ? "btn danger" : "btn";
    const done = v => { ov.hidden = true; yes.onclick = no.onclick = ov.onclick = null; resolve(v); };
    yes.onclick = () => done(true); no.onclick = () => done(false);
    ov.onclick = e => { if (e.target === ov) done(false); };
    ov.hidden = false; setTimeout(() => yes.focus(), 30);
  });
}

/* ---------- Data (salvati sul dispositivo) ---------- */
const KEY = "libreria.books.v1";
function loadBooks(){
  try { const v = JSON.parse(localStorage.getItem(KEY)); return Array.isArray(v) ? v : []; } catch(e){ return []; }
}
function persist(){
  try { localStorage.setItem(KEY, JSON.stringify(state.books)); }
  catch(e){ throw { code: "storage" }; }
  setMeta("lastChangeAt", new Date().toISOString());
  return true;
}
const META_KEY = "libreria.meta.v1";
function getMeta(){ try { return JSON.parse(localStorage.getItem(META_KEY)) || {}; } catch(e){ return {}; } }
function setMeta(k, v){ try { const m = getMeta(); if (v === null) delete m[k]; else m[k] = v; localStorage.setItem(META_KEY, JSON.stringify(m)); } catch(e){} }
function getGoals(){ const g = getMeta().goals; return g && typeof g === "object" ? g : {}; }
function setGoal(year, n){ const g = { ...getGoals() }; if (n) g[year] = n; else delete g[year]; setMeta("goals", g); }
async function writeBook(data, id){
  const now = new Date().toISOString();
  if (id){ const i = state.books.findIndex(b => b.id === id); state.books[i] = { id, ...data, updatedAt: now }; }
  else {
    const nid = "b" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    state.newId = nid; state.books.push({ id: nid, ...data, updatedAt: now });
  }
  persist(); render();
}
async function removeBook(id){ state.books = state.books.filter(b => b.id !== id); persist(); dropCoverURL(id); try { await idb.del(id); } catch(e){} render(); }
function errText(e){
  if (e && e.code === "storage") return "Non riesco a salvare sul dispositivo (memoria piena o navigazione privata).";
  return "Salvataggio non riuscito, riprova.";
}

/* ---------- Copertine (IndexedDB, disponibili offline) ---------- */
const idb = (() => {
  let dbp = null;
  function open(){
    if (!dbp) dbp = new Promise((res, rej) => {
      const r = indexedDB.open("libreria", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("covers");
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  async function run(mode, fn){
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction("covers", mode);
      const req = fn(t.objectStore("covers"));
      t.oncomplete = () => res(req ? req.result : undefined);
      t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  }
  return {
    get: id => run("readonly", s => s.get(id)),
    set: (id, v) => run("readwrite", s => s.put(v, id)),
    del: id => run("readwrite", s => s.delete(id)),
    clear: () => run("readwrite", s => s.clear()),
  };
})();
const coverURLs = {};
async function coverSrc(b){
  if (b.coverLocal){
    if (coverURLs[b.id]) return coverURLs[b.id];
    try { const blob = await idb.get(b.id); if (blob){ coverURLs[b.id] = URL.createObjectURL(blob); return coverURLs[b.id]; } } catch(e){}
  }
  return b.coverUrl || null;
}
function dropCoverURL(id){ if (coverURLs[id]){ URL.revokeObjectURL(coverURLs[id]); delete coverURLs[id]; } }
function updateBook(id, patch){
  const i = state.books.findIndex(b => b.id === id); if (i < 0) return null;
  state.books[i] = { ...state.books[i], ...patch, updatedAt: new Date().toISOString() };
  persist(); return state.books[i];
}
async function setCoverFromUrl(id, url){
  dropCoverURL(id);
  try {
    const r = await fetch(url, { mode: "cors" });
    if (!r.ok) throw 0;
    const blob = await r.blob();
    if (!/^image\//.test(blob.type) || blob.size < 1500) throw 0;
    await idb.set(id, blob);
    return updateBook(id, { coverUrl: url, coverLocal: true });
  } catch(e){
    try { await idb.del(id); } catch(_){}
    const im = new Image(); im.src = url; // il service worker la conserva per l'uso offline
    return updateBook(id, { coverUrl: url, coverLocal: false });
  }
}
async function setCoverFromBlob(id, blob){
  dropCoverURL(id);
  await idb.set(id, blob);
  return updateBook(id, { coverUrl: null, coverLocal: true });
}
async function removeCover(id){
  dropCoverURL(id);
  try { await idb.del(id); } catch(e){}
  return updateBook(id, { coverUrl: null, coverLocal: false });
}
async function photoToBlob(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const max = 900, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(res, "image/jpeg", 0.85));
  } finally { URL.revokeObjectURL(url); }
}
let googleBusyUntil = 0;
async function searchCovers(b){
  const out = [];
  const add = u => { if (u && !out.includes(u)) out.push(u); };
  const title = b.title.length > 40 ? b.title.split(/[.:]/)[0].trim() : b.title;
  const author = b.author.split(",")[0].trim();
  const getJSON = async url => { const r = await fetch(url); if (r.status === 429) { googleBusyUntil = Date.now() + 20000; return null; } if (!r.ok) return null; return r.json(); };

  // 1) Apple Books (negozio italiano): copertine delle edizioni italiane
  const apple = async term => {
    const j = await getJSON(`https://itunes.apple.com/search?term=${encodeURIComponent(term)}&media=ebook&entity=ebook&country=it&limit=10`);
    for (const r of (j && j.results) || []){
      if (r.artworkUrl100) add(r.artworkUrl100.replace(/\/\d+x\d+bb\./, "/400x600bb."));
    }
  };
  try { await apple(`${title} ${author}`); } catch(e){}
  if (!out.length) try { await apple(title); } catch(e){}

  // 2) Google Books
  const google = async (q, lang) => {
    if (Date.now() < googleBusyUntil) return;
    const j = await getJSON(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(q)}&maxResults=10&printType=books${lang ? "&langRestrict=it" : ""}`);
    for (const it of (j && j.items) || []){
      const im = it.volumeInfo && it.volumeInfo.imageLinks;
      const t = im && (im.thumbnail || im.smallThumbnail);
      if (t) add(t.replace(/^http:/, "https:").replace("&edge=curl", ""));
    }
  };
  if (out.length < 6) try { await google(`intitle:${title} inauthor:${author}`, true); } catch(e){}
  if (out.length < 3) try { await google(`${title} ${author}`, false); } catch(e){}

  // 3) Open Library
  if (out.length < 3) try {
    const j = await getJSON(`https://openlibrary.org/search.json?title=${encodeURIComponent(title)}&author=${encodeURIComponent(author)}&limit=10&fields=cover_i`);
    for (const d of (j && j.docs) || []) if (d.cover_i) add(`https://covers.openlibrary.org/b/id/${d.cover_i}-L.jpg`);
  } catch(e){}
  return out.slice(0, 9);
}

/* ---------- Backup ---------- */
function backupName(){ return "libreria-backup-" + new Date().toISOString().slice(0,10) + ".json"; }
async function exportBackup(){
  const books = [];
  for (const b of state.books){
    const copy = { ...b };
    if (b.coverLocal){
      try {
        const blob = await idb.get(b.id);
        if (blob) copy.coverData = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(blob); });
      } catch(e){}
    }
    books.push(copy);
  }
  const payload = JSON.stringify({ app: "libreria", version: 3, exportedAt: new Date().toISOString(), goals: getGoals(), books });
  const name = backupName();
  const file = new File([payload], name, { type: "application/json" });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({ files: [file], title: "Backup libreria" });
      setMeta("lastBackupAt", new Date().toISOString()); setMeta("snoozeUntil", null);
      return "Backup pronto: salvalo su File, iCloud Drive o mandalo con AirDrop.";
    }
  } catch(e){ if (e && e.name === "AbortError") return ""; }
  const url = URL.createObjectURL(file);
  const a = document.createElement("a"); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  setMeta("lastBackupAt", new Date().toISOString()); setMeta("snoozeUntil", null);
  return "Backup scaricato (" + name + ").";
}
function parseBackup(text){
  let data; try { data = JSON.parse(text); } catch(e){ throw new Error("Il file non è un backup valido."); }
  const list = Array.isArray(data) ? data : data && data.books;
  if (!Array.isArray(list)) throw new Error("Il file non contiene una libreria.");
  const out = [];
  for (const b of list){
    if (!b || typeof b.title !== "string" || typeof b.author !== "string") continue;
    const year = parseInt(b.year, 10); if (!year) continue;
    out.push({
      id: String(b.id || ("b" + Math.random().toString(36).slice(2,10))),
      title: b.title.trim(), author: b.author.trim(), year,
      pages: parseInt(b.pages, 10) || null, finished: typeof b.finished === "string" ? b.finished : null,
      rating: Number(b.rating) || null, color: typeof b.color === "string" && /^#[0-9a-f]{6}$/i.test(b.color) ? b.color : null,
      notes: typeof b.notes === "string" ? b.notes : null,
      quotes: typeof b.quotes === "string" ? b.quotes : null,
      authorSort: typeof b.authorSort === "string" && b.authorSort.trim() ? b.authorSort.trim() : null,
      coverUrl: typeof b.coverUrl === "string" && /^https:\/\//.test(b.coverUrl) ? b.coverUrl : null,
      coverLocal: false,
      coverData: typeof b.coverData === "string" && /^data:image\//.test(b.coverData) ? b.coverData : null,
      createdAt: typeof b.createdAt === "string" ? b.createdAt : new Date().toISOString(),
      updatedAt: typeof b.updatedAt === "string" ? b.updatedAt : null,
    });
  }
  if (!out.length) throw new Error("Nel file non ho trovato libri.");
  if (data && data.goals && typeof data.goals === "object"){
    const g = {}; for (const [y, n] of Object.entries(data.goals)){ const yy = parseInt(y, 10), nn = parseInt(n, 10); if (yy && nn > 0) g[yy] = nn; }
    out.goals = g;
  }
  return out;
}
function openMenu(msg){
  const n = state.books.length;
  $("menu").innerHTML = `
    <h3>Backup</h3>
    <p>I libri sono salvati su questo dispositivo e funzionano anche offline. Per portarli su un altro dispositivo, esporta un backup e importalo lì.</p>
    <button class="item" id="mExport">Esporta backup<small>${n} ${n===1?"libro":"libri"} in un file .json · ${esc(lastBackupText())}</small></button>
    <button class="item" id="mImport">Importa backup<small>Sostituisce la libreria di questo dispositivo</small></button>
    <button class="item" id="mCovers">Cerca le copertine mancanti<small>${state.books.filter(b => !b.coverUrl && !b.coverLocal).length} libri senza copertina · serve internet</small></button>
    <div class="ok" id="mOk">${esc(msg || "")}</div>
    <div class="err" id="mErr"></div>
    <div class="actions"><button class="btn ghost" id="mClose">Chiudi</button></div>
    <p style="text-align:center;font-size:12px;margin-top:14px">Versione ${APP_VERSION}</p>`;
  $("menuOv").hidden = false;
  $("mClose").onclick = () => $("menuOv").hidden = true;
  $("mExport").onclick = async () => { $("mErr").textContent = ""; $("mOk").textContent = await exportBackup(); render(); };
  $("mImport").onclick = () => { $("importFile").value = ""; $("importFile").click(); };
  $("mCovers").onclick = async () => {
    const n = state.books.filter(b => !b.coverUrl && !b.coverLocal).length;
    if (n && !(await askConfirm("Cercare le copertine mancanti?", `Cerco online la copertina per ${n} libri e la applico in automatico.`, "Cerca"))) return;
    bulkCovers();
  };
}
let bulkStop = false;
async function bulkCovers(){
  if (!navigator.onLine){ $("mErr").textContent = "Serve la connessione a internet per cercare le copertine."; return; }
  const todo = state.books.filter(b => !b.coverUrl && !b.coverLocal);
  if (!todo.length){ $("mOk").textContent = "Tutti i libri hanno già una copertina."; return; }
  bulkStop = false;
  let found = 0, done = 0;
  $("menu").innerHTML = `<h3>Cerco le copertine</h3>
    <p id="bProg">0 di ${todo.length}…</p>
    <p>Puoi chiudere questa finestra: la ricerca continua. Se una copertina è sbagliata, la cambi dalla scheda del libro.</p>
    <div class="actions"><button class="btn ghost" id="bStop">Interrompi</button><button class="btn" id="bClose">Chiudi</button></div>`;
  $("bStop").onclick = () => { bulkStop = true; };
  $("bClose").onclick = () => { $("menuOv").hidden = true; };
  for (const b of todo){
    if (bulkStop) break;
    try { const urls = await searchCovers(b); if (urls[0]){ await setCoverFromUrl(b.id, urls[0]); found++; } } catch(e){}
    done++;
    const p = document.getElementById("bProg");
    if (p) p.textContent = `${done} di ${todo.length} · trovate ${found}`;
    await new Promise(r => setTimeout(r, 900));
  }
  const p = document.getElementById("bProg");
  if (p) p.textContent = `Fatto: trovate ${found} copertine su ${done} libri${bulkStop ? " (interrotto)" : ""}.`;
  const st = document.getElementById("bStop"); if (st) st.remove();
}
$("importFile").addEventListener("change", async e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  if ($("menuOv").hidden) openMenu();
  let books;
  try { books = parseBackup(await f.text()); }
  catch(err){ $("mErr").textContent = err.message; return; }
  const cur = state.books.length;
  if (!cur){ applyImport(books); return; }
  $("menu").innerHTML = `
    <h3>Importa backup</h3>
    <p>Il file contiene <b>${books.length}</b> libri. Sostituisco i <b>${cur}</b> libri attualmente su questo dispositivo?</p>
    <div class="actions">
      <button class="btn ghost" id="iNo">Annulla</button>
      <button class="btn danger" id="iYes">Sostituisci</button>
    </div>`;
  $("iNo").onclick = () => openMenu();
  $("iYes").onclick = () => applyImport(books);
});
async function applyImport(books){
  const prev = state.books;
  $("menu").innerHTML = `<h3>Importo…</h3><p>Sto sistemando ${books.length} libri sugli scaffali.</p>`;
  try { await idb.clear(); } catch(e){}
  Object.keys(coverURLs).forEach(dropCoverURL);
  for (const b of books){
    if (b.coverData){
      try { const blob = await (await fetch(b.coverData)).blob(); await idb.set(b.id, blob); b.coverLocal = true; } catch(e){}
    }
    delete b.coverData;
  }
  const goals = books.goals; delete books.goals;
  state.books = books;
  try { persist(); } catch(e){ state.books = prev; openMenu(); $("mErr").textContent = errText(e); return; }
  if (goals) setMeta("goals", goals);
  setMeta("lastBackupAt", new Date().toISOString());
  state.view = "all"; state.q = ""; state.author = ""; $("q").value = "";
  render();
  openMenu(`Importati ${books.length} libri.`);
}
$("menuOv").addEventListener("click", e => { if (e.target.id === "menuOv") $("menuOv").hidden = true; });
$("menuBtn").addEventListener("click", () => openMenu());

/* ---------- Form ---------- */
function drawStars(){
  $("fStars").innerHTML = [1,2,3,4,5].map(i => `<button type="button" data-r="${i}" class="${i<=state.rating?"on":""}" aria-label="${i} stelle">★</button>`).join("");
}
function drawSwatches(){
  $("fSw").innerHTML = `<button type="button" class="auto ${!state.color?"on":""}" data-c="">Auto</button>` +
    PALETTE.map(c => `<button type="button" data-c="${c}" class="${state.color===c?"on":""}" style="background:${c}" aria-label="colore"></button>`).join("");
}
function openForm(book){
  state.editing = book ? book.id : null;
  $("formTitle").textContent = book ? "Modifica libro" : "Nuovo libro";
  $("fSave").textContent = book ? "Salva" : "Metti sullo scaffale";
  $("fTitle").value = book?.title || "";
  $("fAuthor").value = book?.author || (state.author || "");
  $("fAuthorSort").value = book?.authorSort || authorLabel($("fAuthor").value);
  sortTouched = !!book?.authorSort;
  $("fYear").value = book?.year || (state.view === "all" ? NOW_YEAR : state.view);
  $("fPages").value = book?.pages || "";
  $("fDate").value = book?.finished || "";
  state.rating = book?.rating || 0;
  state.color = book?.color || "";
  $("fErr").textContent = "";
  drawStars(); drawSwatches();
  if (!$("detOv").hidden) closeDetail();
  $("formOv").hidden = false;
  setTimeout(() => $("fTitle").focus(), 50);
}
function closeForm(){ $("formOv").hidden = true; }

let sortTouched = false;
$("fAuthor").addEventListener("input", () => { if (!sortTouched) $("fAuthorSort").value = authorLabel($("fAuthor").value); });
$("fAuthorSort").addEventListener("input", () => { sortTouched = true; });
$("fDate").addEventListener("change", e => { if (e.target.value) $("fYear").value = e.target.value.slice(0,4); });
$("fStars").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; const r = Number(b.dataset.r); state.rating = state.rating === r ? 0 : r; drawStars(); });
$("fSw").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; state.color = b.dataset.c; drawSwatches(); });
$("fCancel").addEventListener("click", closeForm);
$("formOv").addEventListener("click", e => { if (e.target.id === "formOv") closeForm(); });

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const title = $("fTitle").value.trim(), author = $("fAuthor").value.trim();
  const year = parseInt($("fYear").value, 10);
  if (!title || !author){ $("fErr").textContent = "Titolo e autore sono obbligatori."; return; }
  if (!year || year < 1900 || year > 2100){ $("fErr").textContent = "Inserisci un anno di lettura valido."; return; }
  const prev = state.editing ? state.books.find(b => b.id === state.editing) : null;
  const data = {
    title, author, year,
    authorSort: (() => { const v = $("fAuthorSort").value.trim(); return v && v !== authorLabel(author) ? v : null; })(),
    pages: parseInt($("fPages").value, 10) || null,
    finished: $("fDate").value || null,
    rating: state.rating || null,
    color: state.color || null,
    notes: prev?.notes || null,
    quotes: prev?.quotes || null,
    coverUrl: prev?.coverUrl || null,
    coverLocal: prev?.coverLocal || false,
    createdAt: prev?.createdAt || new Date().toISOString(),
  };
  if (prev && !(await askConfirm("Salvare le modifiche?", `Aggiorno «${title}».`, "Salva"))) return;
  const btn = $("fSave"); btn.disabled = true;
  try {
    await writeBook(data, state.editing);
    if (state.view !== "all" && state.view !== year) state.view = year;
    closeForm(); render();
  } catch(err){ $("fErr").textContent = errText(err); }
  finally { btn.disabled = false; }
});

/* ---------- Detail ---------- */
function fmtDate(d){ try { return new Date(d + "T12:00:00").toLocaleDateString("it-IT", { day:"numeric", month:"long", year:"numeric" }); } catch(e){ return d; } }
let detailId = null, notesTimer = null;
function saveTexts(id){
  const n = document.getElementById("dNotes"), q = document.getElementById("dQuotes");
  if (!n || !q) return;
  updateBook(id, { notes: n.value.trim() || null, quotes: q.value.trim() || null });
}
function flushNotes(){
  if (!notesTimer) return;
  clearTimeout(notesTimer); notesTimer = null;
  if (detailId){ try { saveTexts(detailId); } catch(e){} }
}
function closeDetail(){ flushNotes(); $("detOv").hidden = true; detailId = null; }
async function drawCover(b){
  const box = document.getElementById("dCover"); if (!box) return;
  const src = await coverSrc(b);
  if (detailId !== b.id) return;
  if (src){
    box.innerHTML = `<img class="cover" alt="Copertina di ${esc(b.title)}" src="${esc(src)}">`;
    box.querySelector("img").onerror = () => { box.innerHTML = `<div style="--row:180px;--s:1">${spineHTML(b)}</div>`; };
  } else {
    box.innerHTML = `<div style="--row:180px;--s:1">${spineHTML(b)}</div>`;
  }
  const rm = document.getElementById("dRemove"); if (rm) rm.hidden = !src;
}
function openDetail(id){
  const b = state.books.find(x => x.id === id); if (!b) return;
  detailId = id;
  const chips = [`Letto nel ${b.year}`];
  if (b.finished) chips.push(`Finito il ${fmtDate(b.finished)}`);
  if (b.pages) chips.push(`${b.pages} pagine`);
  $("det").innerHTML = `
    <div class="mini">
      <div id="dCover"></div>
      <div style="min-width:0">
        <h3 style="margin-bottom:10px">${esc(b.title)}</h3>
        <div class="who">${esc(b.author)}</div>
        ${b.rating ? `<div class="st" style="margin-top:8px">${"★".repeat(b.rating)}<span style="color:#5d4c39">${"★".repeat(5-b.rating)}</span></div>` : ""}
        <div class="chips" style="margin:12px 0 0">${chips.map(c => `<span class="chip">${esc(c)}</span>`).join("")}</div>
      </div>
    </div>
    <div class="coveracts">
      <button class="btn ghost small" id="dSearch">Cerca online</button>
      <button class="btn ghost small" id="dPhoto">Usa una foto</button>
      <button class="btn ghost small" id="dRemove" hidden>Togli</button>
    </div>
    <div class="hint" id="dHint"></div>
    <div class="picks" id="dPicks"></div>
    <label for="dNotes">Note e riassunto</label>
    <textarea class="field notesarea" id="dNotes" placeholder="Riassunto, cosa ti è piaciuto, a chi lo consiglieresti…">${esc(b.notes || "")}</textarea>
    <div class="saved" id="dSavedNotes"></div>
    <label for="dQuotes">Citazioni</label>
    <textarea class="field notesarea" id="dQuotes" placeholder="Le frasi che vuoi ricordare…">${esc(b.quotes || "")}</textarea>
    <div class="saved" id="dSavedQuotes"></div>
    <div class="err" id="dErr"></div>
    <div class="actions">
      <button class="btn ghost" id="dDel">Elimina</button>
      <button class="btn ghost" id="dEdit">Modifica</button>
      <button class="btn" id="dClose">Chiudi</button>
    </div>`;
  $("detOv").hidden = false;
  drawCover(b);

  for (const [elId, field, savedId] of [["dNotes","notes","dSavedNotes"],["dQuotes","quotes","dSavedQuotes"]]){
    $(elId).addEventListener("input", () => {
      $(savedId).textContent = "";
      clearTimeout(notesTimer);
      notesTimer = setTimeout(() => {
        notesTimer = null;
        try { saveTexts(id); $(savedId).textContent = "Salvato"; }
        catch(e){ $("dErr").textContent = errText(e); }
      }, 600);
    });
    $(elId).addEventListener("blur", flushNotes);
  }

  $("dSearch").onclick = async () => {
    $("dHint").textContent = ""; $("dPicks").innerHTML = "";
    if (!navigator.onLine){ $("dHint").textContent = "Serve la connessione a internet per cercare la copertina. Puoi usare una foto."; return; }
    $("dHint").textContent = "Cerco…";
    const urls = await searchCovers(b);
    if (detailId !== id) return;
    if (!urls.length){ $("dHint").textContent = "Non ho trovato copertine. Puoi fotografare la tua copia con “Usa una foto”."; return; }
    $("dHint").textContent = "Tocca la copertina giusta:";
    $("dPicks").innerHTML = urls.map(u => `<button type="button" data-u="${esc(u)}"><img src="${esc(u)}" alt="" loading="lazy" onerror="this.parentNode.remove()"></button>`).join("");
  };
  $("dPicks").onclick = async e => {
    const btn = e.target.closest("button[data-u]"); if (!btn) return;
    const cur = state.books.find(x => x.id === id);
    if (!(await askConfirm("Usare questa copertina?", cur && (cur.coverUrl || cur.coverLocal) ? "Sostituirà la copertina attuale." : "", "Usa copertina"))) return;
    $("dHint").textContent = "Salvo la copertina…"; $("dPicks").innerHTML = "";
    const nb = await setCoverFromUrl(id, btn.dataset.u);
    $("dHint").textContent = nb && nb.coverLocal ? "" : "Copertina impostata: sarà disponibile offline dopo averla vista una volta.";
    drawCover(nb || b);
  };
  $("dPhoto").onclick = () => { $("photoFile").value = ""; $("photoFile").click(); };
  $("dRemove").onclick = async () => {
    if (!(await askConfirm("Togliere la copertina?", "Sullo scaffale e nella scheda tornerà il dorso.", "Togli", true))) return;
    const nb = await removeCover(id); $("dHint").textContent = ""; drawCover(nb || b); };
  $("dClose").onclick = closeDetail;
  $("dEdit").onclick = () => { flushNotes(); openForm(state.books.find(x => x.id === id)); };
  $("dDel").onclick = async () => {
    const cur = state.books.find(x => x.id === id);
    if (!(await askConfirm("Eliminare il libro?", `«${cur ? cur.title : ""}» verrà tolto dalla libreria, con copertina, note e citazioni.`, "Elimina", true))) return;
    try { notesTimer && clearTimeout(notesTimer); notesTimer = null; await removeBook(id); closeDetail(); } catch(err){ $("dErr").textContent = errText(err); }
  };
}
$("photoFile").addEventListener("change", async e => {
  const f = e.target.files && e.target.files[0]; if (!f || !detailId) return;
  const id = detailId;
  const cur = state.books.find(x => x.id === id);
  if (!(await askConfirm("Usare questa foto come copertina?", cur && (cur.coverUrl || cur.coverLocal) ? "Sostituirà la copertina attuale." : "", "Usa foto"))) return;
  $("dHint").textContent = "Salvo la foto…"; $("dPicks").innerHTML = "";
  try {
    const blob = await photoToBlob(f);
    const nb = await setCoverFromBlob(id, blob);
    $("dHint").textContent = "";
    drawCover(nb);
  } catch(err){ $("dHint").textContent = "Non sono riuscita a usare questa immagine."; }
});
$("detOv").addEventListener("click", e => { if (e.target.id === "detOv") closeDetail(); });

/* ---------- Events ---------- */
$("addBtn").addEventListener("click", () => openForm(null));
$("main").addEventListener("click", e => {
  if (e.target.id === "wAdd") return openForm(null);
  if (e.target.id === "wImport"){ $("importFile").value = ""; return $("importFile").click(); }
  const s = e.target.closest(".spine"); if (s) openDetail(s.dataset.id);
});
$("years").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; state.view = b.dataset.y === "all" ? "all" : Number(b.dataset.y); render(); });
let qt; $("q").addEventListener("input", e => { clearTimeout(qt); qt = setTimeout(() => { state.q = e.target.value.trim(); if (state.q && state.view !== "all") state.view = "all"; render(); }, 150); });
$("authorSel").addEventListener("change", e => { state.author = e.target.value; if (state.author) state.view = "all"; render(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("cfOv").hidden){ $("cfNo").click(); return; } if (e.key === "Escape"){ closeForm(); if (!$("detOv").hidden) closeDetail(); $("menuOv").hidden = true; } });

state.books = loadBooks();
if (!getMeta().firstSeenAt) setMeta("firstSeenAt", new Date().toISOString());
showView((location.hash || "").slice(1), false);
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
if ("serviceWorker" in navigator && location.protocol !== "file:"){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
})();
